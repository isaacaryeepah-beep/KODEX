name: Frontend E2E Tests

# Separate workflow from Backend Tests (tests.yml) rather than a bolt-on job
# there: this suite needs a real browser install and is meaningfully slower,
# and -- unlike Jest, which is fully self-contained -- some of these specs
# are genuinely network-dependent (see exam-preflight-person-detection.spec.js),
# so a flake here shouldn't block the fast, deterministic backend suite.

on:
  push:
    branches: [main, claude/are-you-there-hjdx9r]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (frontend E2E)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # --ignore-scripts: this workflow has access to repo secrets
      # (JWT_SECRET etc. below), so a compromised dependency's postinstall
      # script running here has a real blast radius. None of this repo's
      # own dependencies need a postinstall to function for what this
      # workflow does (no native builds -- bcryptjs is pure JS), and
      # Playwright's own browser download is handled explicitly below
      # anyway, so skipping lifecycle scripts costs nothing here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # --no-install (not bare `npx playwright ...`): forces npx to use the
      # already-installed, package-lock-pinned @playwright/test rather than
      # its default on-demand-fetch-and-run behavior, which would otherwise
      # install and execute an unpinned, unverified package version.
      - name: Install Playwright browsers
        run: npx --no-install playwright install --with-deps chromium

      # Same binary this repo's Jest suites already rely on -- share the
      # cache key so both workflows warm the same cache instead of each
      # paying the download cost separately.
      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          JWT_SECRET: ci-test-jwt-secret-e2e-not-real-0000000001
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-e2e-not-real-01

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
